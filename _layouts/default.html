<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% seo %}
  {% feed_meta %}
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-row">
      <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
      <nav class="site-nav">
        <a href="{{ '/blog/' | relative_url }}" class="{% if page.url contains '/blog/' %}active{% endif %}">Blog</a>
        <a href="{{ '/about/' | relative_url }}" class="{% if page.url == '/about/' %}active{% endif %}">About</a>
        <a href="https://github.com/rickmark" rel="noopener">GitHub ↗</a>
      </nav>
    </div>
  </header>

  <main class="container site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container footer-row">
      <span>© {{ site.time | date: '%Y' }} {{ site.author.name }}</span>
      <span class="footer-links">
        <a href="{{ '/blog/feed.xml' | relative_url }}">RSS</a>
        <a href="https://github.com/rickmark" rel="noopener">GitHub</a>
        <a href="https://linkedin.com/in/penwellr" rel="noopener">LinkedIn</a>
        <a href="https://www.patreon.com/rickmark" rel="noopener">Patreon</a>
      </span>
    </div>
  </footer>
</body>
</html>
