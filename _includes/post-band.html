<section class="band band-tint page-band post-band">
  <div class="container">
    <p class="post-meta">
      <a class="label label-accent" href="{{ '/blog/' | relative_url }}">Blog</a>
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time>
      {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
    </p>
    <h1 class="page-title">{{ page.title }}</h1>
    <div class="rule-blocks" aria-hidden="true"><span></span><span></span><span></span></div>
  </div>
</section>
