<section class="band products-band" id="products">
  <div class="wide">
    <h2 class="section-title">What I'm building</h2>
    <ul class="product-cards">
      {% for p in site.data.products %}
      <li>
        <a class="product-card product-card-{{ p.colour }}" href="{{ '/products/' | relative_url }}#{{ p.slug }}">
          {% if p.shots %}<img src="{{ p.shots[0].src | relative_url }}" alt="" loading="lazy" decoding="async" width="1280" height="800">{% else %}<span class="product-card-art" aria-hidden="true">{% for slug in p.family %}{% assign f = site.data.products | where: "slug", slug | first %}<img src="{{ f.shots[0].src | relative_url }}" alt="" loading="lazy" decoding="async" width="1280" height="800">{% endfor %}</span>{% endif %}
          <span class="product-card-body"><span class="label">{{ p.kicker }}</span><strong>{{ p.name }}</strong><span class="product-card-domain">{{ p.domain }}</span></span>
        </a>
      </li>
      {% endfor %}
    </ul>
    <p class="hero-actions"><a class="button" href="{{ '/products/' | relative_url }}">See all products</a></p>
  </div>
</section>
