<section class="band band-tint page-band">
  <div class="{% if page.wide %}wide{% else %}container{% endif %}">
    {% if page.band_label %}<p class="label label-accent">{{ page.band_label }}</p>{% endif %}
    <h1 class="page-title">{{ page.title }}</h1>
    <div class="rule-blocks" aria-hidden="true"><span></span><span></span><span></span></div>
    {% if page.band_lead %}<p class="lead">{{ page.band_lead }}</p>{% endif %}
  </div>
</section>
