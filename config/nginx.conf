upstream www_richardpenwell_me_upstream {
	server unix:/var/www/www.richardpenwell.me/tmp/sockets/thin.0.sock;
	server unix:/var/www/www.richardpenwell.me/tmp/sockets/thin.1.sock;
	server unix:/var/www/www.richardpenwell.me/tmp/sockets/thin.2.sock;
	server unix:/var/www/www.richardpenwell.me/tmp/sockets/thin.3.sock;
}

server {
	listen 80;

	access_log /var/log/nginx/www.richardpenwell.me.access.log;
	error_log /var/log/nginx/www.richardpenwell.me.error.log;

	root /var/www/www.richardpenwell.me/public/;

	index index.html;

	location /nginx_status {
		stub_status on;
		access_log off;
		allow 127.0.0.1;
		deny all;
		break;
	}

	location / {
		proxy_set_header	X-Real-IP	$remote_addr;
		proxy_set_header	X-Forwarded-For	$proxy_add_x_forwarded_for;
		proxy_set_header	Host		$http_host;
		proxy_redirect		off;

		if (-f $request_filename/index.html) {
			rewrite (.*) $1/index.html break;
		}

		if (-f $request_filename.html) {
			rewrite (.*) $1.html break;
		}

		if (!-f $request_filename) {
			proxy_pass http://www_richardpenwell_me_upstream;
			break;
		}
	}
}
