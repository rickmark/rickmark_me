- slug: lumiere
  name: Lumière Archive
  kicker: Event photos, found by face
  url: https://gallery.luminx.media
  domain: gallery.luminx.media
  colour: gold
  summary: >-
    Lumière Archive is a gallery for event photography. A photographer uploads the night's set, and the people who
    were there find the photos they appear in, grouped by face without anyone being named, then buy and download them.
  facts:
    - Faces are grouped with embeddings in Postgres and pgvector, so nobody has to tag or name anyone
    - Browse by event or by person, then buy a photo and download the full-resolution original
    - The Lumière Uploader Mac app sends a set straight off the camera's SD card, RAW and HEIF included
    - Each photographer gets their own gallery on their own domain
    - Originals can move to cheaper archive storage while previews keep loading fast
  shots:
    - src: /assets/images/products/lumiere-gallery.webp
      alt: The Lumière Archive gallery, with events and people in the sidebar beside a grid of photos marked Owned or priced at $1
      caption: gallery.luminx.media
    - src: /assets/images/products/lumiere-signin.webp
      alt: The Lumière Archive admin sign-in, with the gold Iris aperture mark and a Continue with Facebook button
      caption: Photographer sign-in
  links:
    - name: gallery.luminx.media
      url: https://gallery.luminx.media
    - name: Source on GitHub
      url: https://github.com/lwm-luminx/hedonism_bot

